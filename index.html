<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch Fight">
<title>Deutsch Fight Academy</title>
<style>
:root{
  --navy:#17365d; --blue:#2f67a8; --sky:#dff3ff; --mint:#bcebdc;
  --cream:#fffaf0; --ink:#203044; --muted:#6b7b8e; --white:#fff;
  --good:#1d8b61; --bad:#d94f4f; --gold:#f5b941; --shadow:0 12px 30px rgba(23,54,93,.15);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:
radial-gradient(circle at 10% 10%,rgba(188,235,220,.8),transparent 28%),
radial-gradient(circle at 90% 6%,rgba(223,243,255,.95),transparent 34%),
linear-gradient(180deg,#f8fcff 0%,#eef7ff 55%,#fffaf0 100%);}
button,select,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:820px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--navy),var(--blue));display:grid;place-items:center;color:white;font-weight:900;font-size:25px;box-shadow:var(--shadow);transform:rotate(-3deg)}
.brand h1{font-size:clamp(20px,5vw,30px);line-height:1;margin:0;color:var(--navy);letter-spacing:.02em}
.brand small{display:block;color:var(--muted);margin-top:5px;font-weight:700}
.icon-btn{border:0;border-radius:14px;background:white;color:var(--navy);min-width:46px;height:46px;box-shadow:0 5px 16px rgba(23,54,93,.12);font-size:20px;font-weight:900}
.hero,.panel,.quiz-card,.result-card{background:rgba(255,255,255,.92);border:1px solid rgba(47,103,168,.12);border-radius:26px;box-shadow:var(--shadow)}
.hero{padding:20px;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-90px;background:rgba(188,235,220,.55)}
.mascots{display:flex;justify-content:center;gap:10px;margin:2px 0 14px;position:relative;z-index:1}
.character{width:92px;height:92px;border-radius:30px;display:grid;place-items:center;font-size:48px;box-shadow:inset 0 -8px 0 rgba(23,54,93,.07),0 7px 14px rgba(23,54,93,.12);position:relative}
.character:before{content:"";position:absolute;top:15px;width:48px;height:13px;border-radius:60% 60% 25% 25%;background:#31445f}
.character.bear{background:#c8e7ff}.character.fox{background:#ffd89d}.character.wolf{background:#d8dee9}
.hero h2{text-align:center;margin:0 0 5px;font-size:25px;color:var(--navy)}
.hero p{text-align:center;margin:0;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stat{background:#f5faff;border-radius:17px;text-align:center;padding:10px 5px}
.stat b{display:block;font-size:22px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{background:#f7fbff;border-radius:18px;padding:12px}
.field.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:7px}
select,input[type=number]{width:100%;border:2px solid #dbeaf6;background:white;border-radius:13px;padding:11px;color:var(--ink);font-weight:800;outline:none}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.segment button{border:2px solid #dbeaf6;background:white;border-radius:13px;padding:10px 5px;color:var(--muted);font-weight:900}
.segment button.active{background:var(--navy);color:white;border-color:var(--navy)}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.primary{width:100%;border:0;border-radius:18px;padding:15px;margin-top:14px;background:linear-gradient(135deg,var(--navy),var(--blue));color:white;font-size:18px;font-weight:900;box-shadow:0 8px 0 #102946}
.primary:active{transform:translateY(4px);box-shadow:0 4px 0 #102946}
.secondary{border:0;border-radius:15px;padding:12px 16px;background:#e9f3fb;color:var(--navy);font-weight:900}
.hidden{display:none!important}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;background:rgba(242,249,255,.94);backdrop-filter:blur(8px);padding:8px;border-radius:18px}
.progress-wrap{flex:1}
.progress-text{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:5px}
.progress{height:10px;background:#dceaf4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));width:0;transition:.25s}
.exit{border:0;border-radius:13px;background:white;color:#9b3e48;padding:10px 12px;font-weight:900;box-shadow:0 4px 12px rgba(23,54,93,.1)}
.quiz-card{padding:20px;min-height:500px;display:flex;flex-direction:column}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.badge{border-radius:30px;padding:5px 10px;font-size:11px;font-weight:900;background:#e8f4ff;color:var(--blue)}
.word-area{text-align:center;padding:23px 4px 18px}
.prompt{font-size:clamp(30px,8vw,54px);font-weight:950;color:var(--navy);line-height:1.25;word-break:break-word}
.reading{font-size:15px;color:var(--muted);font-weight:800;margin-top:9px}
.speak{border:0;border-radius:50%;width:48px;height:48px;background:var(--sky);font-size:22px;margin-top:12px}
.options{display:grid;gap:10px}
.option{width:100%;min-height:58px;border:2px solid #dceaf4;background:white;border-radius:17px;padding:12px 14px;text-align:left;color:var(--ink);font-size:17px;font-weight:850;box-shadow:0 4px 0 #d7e6f1}
.option:active{transform:translateY(2px);box-shadow:0 2px 0 #d7e6f1}
.option.correct{background:#dff7ec;border-color:var(--good);color:#126443}
.option.wrong{background:#ffe5e5;border-color:var(--bad);color:#9c2d2d}
.option.dim{opacity:.52}
.unknown{margin-top:10px;width:100%;border:2px dashed #9ab3c9;border-radius:16px;padding:12px;background:#f7fbff;color:var(--muted);font-weight:900}
.feedback{margin-top:14px;border-radius:18px;padding:14px;background:#f2f8fc;text-align:center;font-weight:850;line-height:1.5}
.feedback.good{background:#e4f8ef;color:#126443}.feedback.bad{background:#fff0e5;color:#9b4b18}
.action-row{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:auto;padding-top:15px}
.mark-again{border:0;border-radius:16px;background:#fff0d7;color:#8a5811;font-weight:900;padding:13px}
.next{border:0;border-radius:16px;background:var(--navy);color:white;font-weight:900;padding:13px;font-size:17px}
.result-card{padding:24px;text-align:center}
.medal{font-size:65px}.result-card h2{font-size:30px;color:var(--navy);margin:5px}
.bigscore{font-size:50px;font-weight:950;color:var(--blue);margin:12px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.result-cell{background:#f3f8fc;border-radius:17px;padding:13px 5px}.result-cell b{font-size:24px;display:block}
.list{max-height:250px;overflow:auto;text-align:left;margin:12px 0;border-radius:16px;background:#f7fbff;padding:8px}
.list-item{padding:9px;border-bottom:1px solid #dceaf4;font-size:14px}.list-item:last-child{border:0}
.small-note{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:560px){
 .app{padding-left:10px;padding-right:10px}.hero,.quiz-card,.result-card{border-radius:22px}
 .character{width:76px;height:76px;font-size:40px;border-radius:25px}.character:before{top:11px}
 .grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quiz-card{min-height:calc(100vh - 110px)}
 .prompt{font-size:clamp(28px,9vw,45px)}.option{font-size:16px}
}

.mode-launch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}
.mode-card{border:2px solid #dbeaf6;border-radius:19px;padding:15px 10px;background:#fff;color:var(--navy);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #d7e6f1;text-align:center}
.mode-card strong{display:block;font-size:18px;margin-top:5px}.mode-card span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.mode-card.sentence{background:linear-gradient(135deg,#e8f4ff,#e8fff7);border-color:#9ccbea}
.sentence-card{background:rgba(255,255,255,.94);border:1px solid rgba(47,103,168,.12);border-radius:26px;box-shadow:var(--shadow);padding:18px;min-height:540px;display:flex;flex-direction:column}
.sentence-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}.sentence-controls select{width:100%;border:2px solid #dbeaf6;background:#fff;border-radius:13px;padding:10px;font-weight:800;color:var(--ink)}
.sentence-ja{font-size:clamp(21px,5.8vw,30px);font-weight:900;line-height:1.5;text-align:center;color:var(--navy);padding:17px 6px}
.sentence-answer{min-height:95px;border:2px dashed #9fc9e8;border-radius:17px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;background:#f8fcff}
.sentence-bank{min-height:115px;padding:17px 3px 8px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start}
.s-token{border:0;border-radius:14px;padding:12px 15px;background:#dff1ff;color:#17365d;font-weight:900;box-shadow:0 4px 0 #bed9ed;cursor:pointer;font-size:16px}.s-token.used{opacity:.22;pointer-events:none}.sentence-answer .s-token{background:var(--navy);color:white;box-shadow:0 4px 0 #102946}
.sentence-feedback{min-height:57px;text-align:center;font-weight:900;line-height:1.5;padding-top:8px}.sentence-feedback.good{color:var(--good)}.sentence-feedback.bad{color:var(--bad)}
.sentence-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:auto;padding-top:10px}.sentence-actions button{border:0;border-radius:15px;padding:12px 8px;font-weight:900}.s-main{background:var(--navy);color:white}.s-sub{background:#e9f3fb;color:var(--navy)}.s-review{background:#fff0d7;color:#8a5811}
.sentence-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.sentence-stat{background:#f3f8fc;border-radius:15px;text-align:center;padding:9px 4px;font-size:12px;color:var(--muted);font-weight:800}.sentence-stat b{display:block;color:var(--navy);font-size:20px}
@media(max-width:560px){.mode-launch{grid-template-columns:1fr}.sentence-controls{grid-template-columns:1fr}.sentence-card{min-height:calc(100vh - 105px);padding:14px}.s-token{font-size:16px}}

</style>

<style id="fight-theme">
:root{
  --navy:#10151d;--blue:#405164;--sky:#222c38;--mint:#91a0ad;
  --cream:#0c1118;--ink:#eef2f5;--muted:#9ba8b5;--white:#fff;
  --good:#35c879;--bad:#ff5b5b;--gold:#e7b94f;--shadow:0 16px 38px rgba(0,0,0,.42);
}
html,body{color:var(--ink);background:
linear-gradient(135deg,rgba(255,255,255,.025) 25%,transparent 25%) 0 0/34px 34px,
linear-gradient(225deg,rgba(255,255,255,.02) 25%,transparent 25%) 0 0/34px 34px,
radial-gradient(circle at 50% -10%,#2b3541 0,#111821 42%,#080c12 100%);}
.app{max-width:860px}
.topbar{padding:5px 2px}.brand h1{color:#f4f6f8;text-transform:uppercase;letter-spacing:.045em;font-style:italic}.brand small{color:#9eabb6}
.logo{border-radius:9px;background:linear-gradient(145deg,#e6e9ec,#707b86 42%,#171d24 43%,#070a0e);border:1px solid #aeb6bd;color:white;transform:skew(-7deg);font-size:19px;text-shadow:0 2px 3px #000;box-shadow:0 0 0 3px #090d12,0 10px 24px rgba(0,0,0,.5)}
.icon-btn,.exit{background:#171e27;color:#eef2f5;border:1px solid #3c4854;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hero,.panel,.quiz-card,.result-card,.sentence-card{background:linear-gradient(160deg,rgba(31,39,49,.97),rgba(12,17,24,.97));border:1px solid #3c4651;border-radius:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before,.quiz-card:before,.sentence-card:before,.result-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#79838d,#fff,#59636d,#e7b94f,#59636d,#fff,#79838d)}
.hero:after{width:300px;height:300px;right:-170px;top:-170px;background:radial-gradient(circle,rgba(231,185,79,.13),transparent 66%)}
.fight-emblem{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 13px;position:relative;z-index:1}
.glove{font-size:52px;filter:grayscale(1) contrast(1.25) drop-shadow(0 7px 5px #000);transform:rotate(-18deg)}.glove.mirror{transform:scaleX(-1) rotate(-18deg)}
.belt{min-width:150px;padding:10px 17px;background:linear-gradient(#11161d,#020305);border:3px solid #88929c;outline:3px solid #090c10;color:#e8edf0;font-weight:950;letter-spacing:.13em;text-align:center;line-height:1.05;transform:skew(-6deg);box-shadow:0 9px 18px #000;font-size:13px}.belt span{font-size:27px;color:#e7b94f}
.rank-strip{display:flex;align-items:center;justify-content:center;gap:10px;font-size:10px;letter-spacing:.12em;font-weight:900;color:#aab4bd;margin-bottom:11px}.rank-strip i{width:70px;height:5px;background:linear-gradient(90deg,#eee,#e7b94f,#111);border-radius:8px}
.hero h2{color:#fff;text-transform:uppercase;font-style:italic;letter-spacing:.02em}.hero p{color:#aeb8c1}
.stats{position:relative;z-index:1}.stat,.field,.result-cell,.sentence-stat{background:linear-gradient(145deg,#202936,#111720);border:1px solid #34404c;border-radius:8px}.stat b,.sentence-stat b{color:#e7b94f}.stat span,label,.small-note{color:#a6b1bb}
select,input[type=number]{background:#0d131a;color:#f2f5f7;border-color:#44505d;border-radius:7px}.segment button{background:#121922;color:#aab4bd;border-color:#3c4854;border-radius:7px}.segment button.active{background:linear-gradient(135deg,#e7b94f,#9b711c);border-color:#f0ca67;color:#090b0e}
.mode-card{border-radius:9px!important;background:linear-gradient(145deg,#222c37,#0d131a)!important;border:1px solid #46515d!important;color:#f1f4f6!important;box-shadow:0 7px 0 #05070a!important}.mode-card strong{color:#fff}.mode-card span{color:#aab4bd!important}.mode-card.sentence{background:linear-gradient(145deg,#31291a,#12100b)!important;border-color:#756231!important}
.primary,.next,.s-main{background:linear-gradient(135deg,#e7b94f,#9a701d);color:#080a0d;border-radius:8px;box-shadow:0 7px 0 #4c350b;text-transform:uppercase;letter-spacing:.04em}.primary:active{box-shadow:0 3px 0 #4c350b}
.secondary,.s-sub{background:#202a35;color:#eef2f5;border:1px solid #45515d;border-radius:8px}.unknown{background:#121922;color:#aab4bd;border-color:#596572;border-radius:8px}.mark-again,.s-review{background:#342b17;color:#f1c85c;border:1px solid #6d5825;border-radius:8px}
.quiz-head{background:rgba(8,12,18,.94);border:1px solid #303a45;border-radius:8px}.progress{background:#202934}.progress i{background:linear-gradient(90deg,#6d7680,#e7b94f,#f7dc8b)}
.badge{background:#232d38;color:#d7dde2;border:1px solid #46515d;border-radius:5px}.prompt,.sentence-ja{color:#fff;text-shadow:0 3px 8px #000}.reading{color:#9ba8b5}.speak{background:#202a35;border:1px solid #485460}
.option{background:linear-gradient(145deg,#202936,#111720);border-color:#3b4753;color:#edf1f4;border-radius:8px;box-shadow:0 4px 0 #080b0f}.option.correct{background:#103822;border-color:#35c879;color:#8bf0b5}.option.wrong{background:#3c1517;border-color:#ff5b5b;color:#ffaaaa}
.feedback{background:#151d26;border:1px solid #34404b;border-radius:8px}.feedback.good{background:#103421;color:#78eaa5}.feedback.bad{background:#3a2015;color:#ffb07c}
.sentence-answer{background:#0b1118;border-color:#5e6a76;border-radius:8px}.s-token{background:linear-gradient(145deg,#364351,#1b242e);color:#f0f3f5;border:1px solid #53606d;border-radius:7px;box-shadow:0 4px 0 #090d12}.sentence-answer .s-token{background:linear-gradient(135deg,#e7b94f,#9b711c);color:#090b0e;box-shadow:0 4px 0 #4d360b}
.result-card .medal{filter:grayscale(.45)}.bigscore{color:#e7b94f}.list{background:#0e141b}.list-item{border-color:#313b46}
@media(max-width:560px){.glove{font-size:40px}.belt{min-width:125px}.belt span{font-size:23px}.fight-emblem{gap:7px}.brand h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">DF</div><div><h1>Deutsch Fight Academy</h1><small>語彙と文章を鍛えるドイツ語道場</small></div></div>
    <button class="icon-btn" id="soundToggle" aria-label="音のオンオフ">🔊</button>
  </header>

  <main id="home">
    <section class="hero">
      <div class="fight-emblem" aria-label="格闘技エンブレム">
        <div class="glove">🥊</div><div class="belt">DEUTSCH<br><span>FIGHT</span></div><div class="glove mirror">🥊</div>
      </div>
      <div class="rank-strip"><span>WHITE BELT</span><i></i><span>BLACK BELTを目指せ</span></div>
      <h2>言葉を鍛えろ。文章で決めろ。</h2>
      <p>単語トレーニングと文章コンボで、ドイツ語を仕上げよう。</p>

      <div class="mode-launch">
        <button class="mode-card" type="button" id="wordModeBtn">📘<strong>単語トレーニング</strong><span>4択で単語を覚える</span></button>
        <button class="mode-card sentence" type="button" id="sentenceModeBtn">🥊<strong>文章コンボ</strong><span>日本語を見て文を作る</span></button>
      </div>
      <div class="stats">
        <div class="stat"><b id="totalWords">0</b><span>収録語</span></div>
        <div class="stat"><b id="bestRate">0%</b><span>最高正答率</span></div>
        <div class="stat"><b id="reviewCount">0</b><span>復習候補</span></div>
      </div>
      <div class="grid">
        <div class="field">
          <label>出題範囲</label>
          <select id="lesson">
            <option value="all">第1〜7課すべて</option>
            <option value="1">第1課</option><option value="2">第2課</option><option value="3">第3課</option>
            <option value="4">第4課</option><option value="5">第5課</option><option value="6">第6課</option><option value="7">第7課</option>
            <option value="review">まちがえた単語だけ</option>
          </select>
        </div>
        <div class="field">
          <label>問題数</label>
          <select id="count">
            <option value="10">10問</option><option value="20" selected>20問</option>
            <option value="30">30問</option><option value="50">50問</option><option value="all">全部</option>
          </select>
        </div>
        <div class="field full">
          <label>出題方向</label>
          <div class="segment" id="direction">
            <button type="button" class="active" data-value="de-ja">ドイツ語 → 日本語</button>
            <button type="button" data-value="ja-de">日本語 → ドイツ語</button>
          </div>
        </div>
        <div class="field full">
          <label>表示設定</label>
          <div class="checks">
            <label class="check"><input type="checkbox" id="showReading" checked> カタカナ発音</label>
            <label class="check"><input type="checkbox" id="autoSpeak"> 自動読み上げ</label>
          </div>
        </div>
      </div>
      <button class="primary" id="startBtn">ファイト開始</button>
      <div class="small-note">成績と復習リストは、この端末のブラウザ内に保存されます。</div>
    </section>
  </main>

  <main id="quiz" class="hidden">
    <div class="quiz-head">
      <div class="progress-wrap">
        <div class="progress-text"><span id="qNo">1 / 20</span><span id="scoreMini">正解 0</span></div>
        <div class="progress"><i id="bar"></i></div>
      </div>
      <button class="exit" id="exitBtn">終了</button>
    </div>
    <section class="quiz-card">
      <div class="badges"><span class="badge" id="lessonBadge"></span><span class="badge" id="posBadge"></span><span class="badge hidden" id="genderBadge"></span></div>
      <div class="word-area">
        <div class="prompt" id="prompt"></div>
        <div class="reading" id="reading"></div>
        <button class="speak" id="speakBtn" aria-label="ドイツ語を読む">🔈</button>
      </div>
      <div class="options" id="options"></div>
      <button class="unknown" id="unknownBtn">わからない（復習に入れる）</button>
      <div class="feedback hidden" id="feedback"></div>
      <div class="action-row hidden" id="actionRow">
        <button class="mark-again" id="markAgain">もう一度やる</button>
        <button class="next" id="nextBtn">次へ</button>
      </div>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const storage = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};
let direction="de-ja", soundOn=true, queue=[], index=0, correct=0, answered=false;
let missedIds=new Set(), current=null, sessionAnswers=[];

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}
  return x;
}
function updateHome(){
  $("#totalWords").textContent=WORDS.length;
  $("#bestRate").textContent=(storage.get("dq_best",0)||0)+"%";
  $("#reviewCount").textContent=storage.get("dq_review",[]).length;
}
function beep(kind){
  if(!soundOn) return;
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=kind==="good"?"sine":"square";
    o.frequency.setValueAtTime(kind==="good"?660:180,ac.currentTime);
    if(kind==="good")o.frequency.exponentialRampToValueAtTime(990,ac.currentTime+.12);
    g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);
    o.start();o.stop(ac.currentTime+.23);
  }catch(e){}
}
function speak(word){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang="de-DE";u.rate=.78;u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const de=voices.find(v=>v.lang.toLowerCase().startsWith("de"));
  if(de)u.voice=de;
  speechSynthesis.speak(u);
}
function start(customReview=false){
  let pool=WORDS;
  const selected=$("#lesson").value;
  const review=storage.get("dq_review",[]);
  if(customReview || selected==="review") pool=WORDS.filter(w=>review.includes(w.id));
  else if(selected!=="all") pool=WORDS.filter(w=>String(w.lesson)===selected);
  if(!pool.length){alert("復習する単語がまだありません。まず通常の問題に挑戦してね。");return}
  let n=$("#count").value==="all"?pool.length:Math.min(Number($("#count").value),pool.length);
  queue=shuffle(pool).slice(0,n); index=0; correct=0; answered=false; missedIds=new Set(); sessionAnswers=[];
  $("#home").classList.add("hidden");$("#result").classList.add("hidden");$("#quiz").classList.remove("hidden");
  renderQuestion();
}
function getWrongChoices(w){
  const value=x=>direction==="de-ja"?x.ja:x.de;
  const sameType=WORDS.filter(x=>x.id!==w.id && x.pos===w.pos && value(x)!==value(w));
  const broad=WORDS.filter(x=>x.id!==w.id && value(x)!==value(w));
  return shuffle(sameType.length>=3?sameType:broad).slice(0,3);
}
function renderQuestion(){
  answered=false;current=queue[index];
  $("#qNo").textContent=`${index+1} / ${queue.length}`;
  $("#scoreMini").textContent=`正解 ${correct}`;
  $("#bar").style.width=`${(index/queue.length)*100}%`;
  $("#lessonBadge").textContent=`第${current.lesson}課`;
  $("#posBadge").textContent=current.pos;
  if(current.gender){$("#genderBadge").textContent=current.gender+"名詞";$("#genderBadge").classList.remove("hidden")}
  else $("#genderBadge").classList.add("hidden");
  $("#prompt").textContent=direction==="de-ja"?current.de:current.ja;
  $("#reading").textContent=(direction==="de-ja" && $("#showReading").checked)?`［${current.reading}］`:"";
  $("#speakBtn").classList.toggle("hidden",direction!=="de-ja");
  $("#feedback").className="feedback hidden";$("#actionRow").classList.add("hidden");$("#unknownBtn").classList.remove("hidden");
  const candidates=shuffle([current,...getWrongChoices(current)]);
  const box=$("#options");box.innerHTML="";
  candidates.forEach(w=>{
    const b=document.createElement("button");
    b.className="option";b.textContent=direction==="de-ja"?w.ja:w.de;
    b.dataset.id=w.id;b.onclick=()=>answer(w.id,false);box.appendChild(b);
  });
  if($("#autoSpeak").checked && direction==="de-ja") setTimeout(()=>speak(current.de),220);
}
function answer(chosenId,unknown){
  if(answered)return;answered=true;
  const isCorrect=!unknown && chosenId===current.id;
  const buttons=$$("#options .option");
  buttons.forEach(b=>{
    if(b.dataset.id===current.id)b.classList.add("correct");
    else if(b.dataset.id===chosenId)b.classList.add("wrong");
    else b.classList.add("dim");
    b.disabled=true;
  });
  $("#unknownBtn").classList.add("hidden");
  const fb=$("#feedback");fb.classList.remove("hidden");
  if(isCorrect){
    correct++;beep("good");fb.classList.add("good");
    fb.innerHTML=`正解！ <b>${current.de}</b> ＝ ${current.ja}`;
  }else{
    missedIds.add(current.id);beep("bad");fb.classList.add("bad");
    fb.innerHTML=`${unknown?"復習に追加しました。":"おしい！"}<br><b>${current.de}</b>［${current.reading}］＝ ${current.ja}`;
  }
  sessionAnswers.push({id:current.id,correct:isCorrect});
  $("#scoreMini").textContent=`正解 ${correct}`;
  $("#actionRow").classList.remove("hidden");
  $("#nextBtn").textContent=index===queue.length-1?"結果を見る":"次へ";
}
function next(){
  index++;
  if(index>=queue.length) finish(); else renderQuestion();
}
function finish(){
  const old=new Set(storage.get("dq_review",[]));
  sessionAnswers.forEach(a=>a.correct?old.delete(a.id):old.add(a.id));
  storage.set("dq_review",[...old]);
  const rate=Math.round(correct/queue.length*100);
  storage.set("dq_best",Math.max(storage.get("dq_best",0),rate));
  $("#quiz").classList.add("hidden");$("#result").classList.remove("hidden");
  $("#finalRate").textContent=rate+"%";$("#finalCorrect").textContent=correct;
  $("#finalWrong").textContent=queue.length-correct;$("#finalTotal").textContent=queue.length;
  $("#medal").textContent=rate>=90?"🏆":rate>=70?"🥇":rate>=50?"🥈":"🛡️";
  const missed=[...missedIds].map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);
  $("#missedWrap").classList.toggle("hidden",!missed.length);
  $("#reviewBtn").classList.toggle("hidden",!missed.length);
  $("#missedList").innerHTML=missed.map(w=>`<div class="list-item"><b>${w.de}</b> ［${w.reading}］<br>${w.ja}</div>`).join("");
  $("#bar").style.width="100%"; updateHome();
}
$("#direction").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  $$("#direction button").forEach(x=>x.classList.remove("active"));b.classList.add("active");direction=b.dataset.value;
};
$("#startBtn").onclick=()=>start(false);
$("#unknownBtn").onclick=()=>answer("",true);
$("#nextBtn").onclick=next;
$("#markAgain").onclick=()=>{
  if(!missedIds.has(current.id))missedIds.add(current.id);
  queue.push(current);next();
};
$("#speakBtn").onclick=()=>speak(current.de);
$("#soundToggle").onclick=()=>{soundOn=!soundOn;$("#soundToggle").textContent=soundOn?"🔊":"🔇"};
$("#exitBtn").onclick=()=>{if(confirm("ここまでの結果を保存して終了しますか？"))finish()};
$("#homeBtn").onclick=()=>{$("#result").classList.add("hidden");$("#home").classList.remove("hidden");updateHome()};
$("#reviewBtn").onclick=()=>start(true);
updateHome();
</script>

const SKEY="dq_sentence_v1";
const sStore={get(){try{return JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){return {}}},set(v){localStorage.setItem(SKEY,JSON.stringify(v))}};
let sState=sStore.get();sState.mistakes=sState.mistakes||[];sState.correct=sState.correct||0;sState.wrong=sState.wrong||0;sState.settings=sState.settings||{};
let sQueue=[],sIndex=0,sSelected=[],sChecked=false,sTokens=[];
const sq=s=>document.querySelector(s), sqa=s=>[...document.querySelectorAll(s)];
function sShuffle(a){return [...a].sort(()=>Math.random()-.5)}
function sNorm(x){return x.replace(/\s+/g," ").trim()}
function sSave(){sState.settings={lesson:sq('#sLesson').value,mode:sq('#sMode').value,order:sq('#sOrder').value,count:sq('#sCount').value};sStore.set(sState)}
function sUpdateStats(){sq('#sCorrect').textContent=sState.correct;sq('#sWrong').textContent=sState.wrong;let t=sState.correct+sState.wrong;sq('#sRate').textContent=t?Math.round(sState.correct/t*100)+'%':'0%'}
function sMakeTokens(item){return sq('#sMode').value==='easy'?[...item.chunks]:(item.de.match(/[^\s]+/g)||[])}
function sInitSelectors(){let ls=['すべての課',...new Set(SENTENCE_DATA.map(x=>x.lesson))];sq('#sLesson').innerHTML=ls.map(x=>`<option>${x}</option>`).join('');let st=sState.settings;sq('#sLesson').value=st.lesson||'すべての課';sq('#sMode').value=st.mode||'easy';sq('#sOrder').value=st.order||'random';sq('#sCount').value=st.count||'10'}
function openSentence(){sq('#home').classList.add('hidden');sq('#quiz').classList.add('hidden');sq('#result').classList.add('hidden');sq('#sentenceQuiz').classList.remove('hidden');sStart()}
function sStart(){let pool=[...SENTENCE_DATA];let lesson=sq('#sLesson').value;if(lesson!=='すべての課')pool=pool.filter(x=>x.lesson===lesson);if(sq('#sOrder').value==='mistakes')pool=pool.filter(x=>sState.mistakes.includes(x.id));if(sq('#sOrder').value==='random')pool=sShuffle(pool);let n=sq('#sCount').value==='all'?pool.length:Number(sq('#sCount').value);sQueue=pool.slice(0,n);sIndex=0;sSave();if(!sQueue.length){alert('復習する文章がまだありません。');sq('#sOrder').value='random';return sStart()}sRender()}
function sRender(){sChecked=false;sSelected=[];let item=sQueue[sIndex];sq('#sQNo').textContent=`${sIndex+1} / ${sQueue.length}`;sq('#sScoreMini').textContent=`正解 ${sState.correct}`;sq('#sBar').style.width=`${(sIndex/sQueue.length)*100}%`;sq('#sLessonBadge').textContent=item.lesson;sq('#sJa').textContent=item.ja;sq('#sFeedback').className='sentence-feedback';sq('#sFeedback').textContent='';sq('#sCheck').classList.remove('hidden');sq('#sNext').classList.add('hidden');sTokens=sShuffle(sMakeTokens(item));sDrawBank();sUpdateStats()}
function sDrawBank(){let bank=sq('#sBank');bank.innerHTML='';sTokens.forEach((t,i)=>{let b=document.createElement('button');b.className='s-token';b.textContent=t;b.dataset.i=i;b.onclick=()=>{if(sChecked)return;sSelected.push({text:t,index:i});sDrawBank();sDrawAnswer()};if(sSelected.some(x=>x.index===i))b.classList.add('used');bank.appendChild(b)});sDrawAnswer()}
function sDrawAnswer(){let area=sq('#sAnswer');area.innerHTML='';sSelected.forEach((x,i)=>{let b=document.createElement('button');b.className='s-token';b.textContent=x.text;b.onclick=()=>{if(sChecked)return;sSelected.splice(i,1);sDrawBank()};area.appendChild(b)})}
function sSpeak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.84;speechSynthesis.speak(u)}
function sCheck(){if(sChecked)return;let item=sQueue[sIndex],ans=sNorm(sSelected.map(x=>x.text).join(' ')),fb=sq('#sFeedback');sChecked=true;if(ans===sNorm(item.de)){sState.correct++;sState.mistakes=sState.mistakes.filter(id=>id!==item.id);fb.className='sentence-feedback good';fb.textContent='正解！ Sehr gut! 🎉';sSpeak(item.de)}else{sState.wrong++;if(!sState.mistakes.includes(item.id))sState.mistakes.push(item.id);fb.className='sentence-feedback bad';fb.innerHTML=`おしい！<br>正解：${item.de}`}sSave();sUpdateStats();sq('#sCheck').classList.add('hidden');sq('#sNext').classList.remove('hidden')}
function sNext(){if(sIndex<sQueue.length-1){sIndex++;sRender()}else{sq('#sBar').style.width='100%';sq('#sJa').textContent='今日の練習はおしまい！';sq('#sAnswer').innerHTML='';sq('#sBank').innerHTML='';sq('#sFeedback').className='sentence-feedback good';sq('#sFeedback').textContent='Gut gemacht! よくできました。';sq('#sNext').classList.add('hidden')}}
function sShow(){if(sChecked)return;let item=sQueue[sIndex];sSelected=[];sTokens=sMakeTokens(item);sSelected=sTokens.map((text,index)=>({text,index}));sDrawBank();sChecked=true;sState.wrong++;if(!sState.mistakes.includes(item.id))sState.mistakes.push(item.id);sSave();sUpdateStats();sq('#sFeedback').className='sentence-feedback bad';sq('#sFeedback').textContent='正解：'+item.de;sq('#sCheck').classList.add('hidden');sq('#sNext').classList.remove('hidden')}
sq('#sentenceModeBtn').onclick=openSentence;sq('#wordModeBtn').onclick=()=>sq('#startBtn').scrollIntoView({behavior:'smooth',block:'center'});
sq('#sExitBtn').onclick=()=>{sq('#sentenceQuiz').classList.add('hidden');sq('#home').classList.remove('hidden')};
sq('#sUndo').onclick=()=>{if(!sChecked&&sSelected.length){sSelected.pop();sDrawBank()}};sq('#sClear').onclick=()=>{if(!sChecked){sSelected=[];sDrawBank()}};sq('#sCheck').onclick=sCheck;sq('#sNext').onclick=sNext;sq('#sShow').onclick=sShow;sq('#sMark').onclick=()=>{let id=sQueue[sIndex].id;if(!sState.mistakes.includes(id))sState.mistakes.push(id);sSave();sq('#sFeedback').className='sentence-feedback bad';sq('#sFeedback').textContent='復習リストに入れました。'};
['#sLesson','#sMode','#sOrder','#sCount'].forEach(id=>sq(id).onchange=sStart);sInitSelectors();sUpdateStats();
</script>
